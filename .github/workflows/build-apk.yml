name: Build Release APK

on:
  workflow_dispatch:   # Só roda quando você clicar manualmente

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Decodificar Keystore
        run: |
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 --decode > debug.keystore

      - name: Tornar gradlew executável
        run: chmod +x ./gradlew

      - name: Build APK Release Assinado
        run: ./gradlew assembleRelease
        env:
          STORE_FILE: debug.keystore
          STORE_PASSWORD: android
          KEY_ALIAS: androiddebugkey
          KEY_PASSWORD: android

      - name: Upload APK Release
        uses: actions/upload-artifact@v4
        with:
          name: Ecodriver-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
